# Weekly pull requests for newer Go modules and GitHub Actions, grouped so
# that a week's updates come as one pull request each; CI tests them.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
