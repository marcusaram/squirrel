# Tests every push to main and every pull request: the Go tests on Linux
# (also on real XFS, ext4 and FAT file systems), on macOS and on Windows
# (the maker's code for each, on Windows with a virtual disk as the card),
# formatting, the builds for every board, and the web pages' scripts.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tools the tests use when they are there
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libxml2-utils
      - name: Formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "not gofmt'ed:"; echo "$unformatted"; exit 1; fi
      - run: make test
      - name: Tests on XFS, with reflinks
        run: make test-linux
      - name: squirreld for every board
        run: make build
      - name: Web pages
        run: |
          for f in internal/web/static/*.js internal/makerui/static/*.js; do node --check "$f"; done
          for f in internal/web/static/*.svg internal/makerui/static/*.svg; do xmllint --noout "$f"; done
      - name: Shell scripts
        run: for f in deploy/*.sh scripts/*.sh; do bash -n "$f"; done

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - name: Squirrel Maker builds (app and command line, without the payload)
        run: make app-bundle maker-bin VERSION=ci

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests of the maker's packages
        run: go test ./internal/ext4 ./internal/fatfs ./internal/maker ./internal/makerui
      - name: A virtual disk as the card
        env:
          SQUIRREL_TEST_VHD: ${{ runner.temp }}\card.vhdx
        run: go test -v -run WindowsCard ./internal/maker
      - name: Squirrel Maker builds (app and command line)
        run: |
          go build -o squirrel-app.exe ./cmd/squirrel-app
          go build -o squirrel-maker.exe ./cmd/squirrel-maker
