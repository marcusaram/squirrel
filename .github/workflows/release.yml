# A release for every version tag (v1.2.3): squirreld for each board, and
# Squirrel Maker as a Mac app and as a command line program, with the
# packages a new card installs at its first start.
#
#   git tag v0.16.0 && git push origin v0.16.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # What needs Linux and Docker: squirreld and the packages for the card.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: make test
      - name: squirreld archives
        run: make release VERSION="$VERSION"
      - name: Packages for a new card
        run: make payload-linux VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: squirreld
          path: dist/squirreld-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: payload-linux
          path: |
            internal/makerui/payload/files
            internal/makerui/payload/files-armv6
            internal/makerui/payload/armbian
          if-no-files-found: error

  # What needs a Mac: e2fsprogs for the ROCK 4C+ card, and the app.
  macos:
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: payload-linux
          path: internal/makerui/payload
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Squirrel Maker
        run: |
          make payload-mac VERSION="$VERSION"
          make app-bundle maker-bin VERSION="$VERSION"
          cd dist && zip -q "squirrel-maker-$VERSION-macos.zip" squirrel-maker
      - uses: actions/upload-artifact@v4
        with:
          name: maker
          path: |
            dist/Squirrel-Maker-*.zip
            dist/squirrel-maker-*-macos.zip
          if-no-files-found: error

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: squirreld
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: maker
          path: out
      - name: Checksums
        run: cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v1.2.0-rc1) is a pre-release.
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "Squirrel ${GITHUB_REF_NAME#v}" --generate-notes "${pre[@]}"
