# A release for every version tag (v1.2.3): squirreld for each board, and
# Squirrel Maker for macOS (app and command line) and Windows (both in one
# zip), with the packages a new card installs at its first start.
#
#   git tag v0.16.0 && git push origin v0.16.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # What needs Linux and Docker: squirreld and the packages for the card.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: make test
      - name: squirreld archives
        run: make release VERSION="$VERSION"
      - name: Packages for a new card
        run: make payload VERSION="$VERSION"
      - name: Squirrel Maker for Windows
        run: make app-windows-bundle VERSION="$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: squirreld
          path: dist/squirreld-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: maker-windows
          path: dist/Squirrel-Maker-*-windows.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: payload
          path: |
            internal/makerui/payload/files
            internal/makerui/payload/files-armv6
            internal/makerui/payload/armbian
          if-no-files-found: error

  # What needs a Mac: the app.
  macos:
    needs: linux
    runs-on: macos-latest
    env:
      # A Developer ID Application certificate (.p12, base64) and an App
      # Store Connect API key (.p8, base64) for notarization. Without them
      # the Mac downloads are signed ad hoc, as before.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: payload
          path: internal/makerui/payload
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          # A keychain of its own, gone with the runner.
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(openssl rand -hex 16)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$id" ] || { echo "no Developer ID Application certificate in MACOS_CERTIFICATE"; exit 1; }
          echo "MAC_SIGN=$id" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY" ]; then
            echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "NOTARY=--key $RUNNER_TEMP/notary.p8 --key-id $APPLE_API_KEY_ID --issuer $APPLE_API_ISSUER" >> "$GITHUB_ENV"
          else
            echo "::warning::APPLE_API_KEY is not set: signed, but not notarized"
          fi
      - name: Squirrel Maker
        run: |
          [ -n "${MAC_SIGN:-}" ] || echo "::warning::MACOS_CERTIFICATE is not set: the Mac downloads are not signed"
          make app-bundle maker-bin VERSION="$VERSION" MAC_SIGN="${MAC_SIGN:--}" NOTARY="${NOTARY:-}"
      - uses: actions/upload-artifact@v7
        with:
          name: maker
          path: |
            dist/Squirrel-Maker-*.zip
            dist/squirrel-maker-*-macos.zip
          if-no-files-found: error

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: squirreld
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: maker
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: maker-windows
          path: out
      - name: Checksums
        run: cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made by hand on GitHub (which also makes the tag) gets
          # the files; its title, notes and pre-release mark stay as they are.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          # A tag with a suffix (v1.2.0-rc1) is a pre-release.
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          if ! gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "Squirrel ${GITHUB_REF_NAME#v}" --generate-notes "${pre[@]}"; then
            # Made meanwhile (another run, or by hand): fill that one. Any
            # other failure stays a failure.
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || exit 1
            gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
          fi
