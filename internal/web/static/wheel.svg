<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- A Model 3/Y style steering wheel, flat, drawn for Squirrel. The rim's
       centre is the image's centre, which the player turns it around; the
       rim is flat at the bottom, as on the car. Colours from the web UI's
       palette in app.css (line, raised and muted, and lane yellow for the
       mark at the top that shows the angle). -->
  <!-- Rim and spokes as one piece, with the openings cut out: wide at the
       top, a window either side below, and a small one under the hub. -->
  <path fill="#38404a" fill-rule="evenodd" stroke="#95a0ab" stroke-width="1.5" stroke-linejoin="round" d="
    M54 182 A94 94 0 1 1 146 182 C138 186.8 120 186.8 100 186.8 C80 186.8 62 186.8 54 182 Z
    M32.6 72 A73 73 0 0 1 167.4 72 C169.5 76 167 79.5 161 78 C145 77 125 71 100 71 C75 71 55 77 39 78 C33 79.5 30.5 76 32.6 72 Z
    M26 118 C27 108 33 105.5 40 105.3 C50 105 57 108.5 62 113 C70 122 78 142 84 158 Q86 166 80 168 C65 167 56 161 50 156.6 C40 148 31 138 26 118 Z
    M174 118 C173 108 167 105.5 160 105.3 C150 105 143 108.5 138 113 C130 122 122 142 116 158 Q114 166 120 168 C135 167 144 161 150 156.6 C160 148 169 138 174 118 Z
    M93 143 L107 143 L104 158 Q100 161 96 158 Z"/>
  <!-- The mark at the top of the rim, to read the angle by. -->
  <path fill="none" stroke="#f2c94c" stroke-width="10" d="M93 16.3 A84 84 0 0 1 107 16.3"/>
  <!-- The hub, wide at the top and narrowing down, with the airbag cover. -->
  <path fill="#2d343c" stroke="#95a0ab" stroke-width="1.5" stroke-linejoin="round"
    d="M61 74 Q100 69 139 74 L132 128 Q130 140 118 142 L82 142 Q70 140 68 128 Z"/>
  <path fill="none" stroke="#4d5662" stroke-width="1.2" stroke-linejoin="round"
    d="M71 82 Q100 78 129 82 L124 123 Q122 131 112 132 L88 132 Q78 131 76 123 Z"/>
  <!-- The scroll wheels on the spokes. -->
  <circle cx="47" cy="93" r="5" fill="#2d343c" stroke="#95a0ab" stroke-width="1.3"/>
  <circle cx="47" cy="93" r="2" fill="#95a0ab"/>
  <circle cx="153" cy="93" r="5" fill="#2d343c" stroke="#95a0ab" stroke-width="1.3"/>
  <circle cx="153" cy="93" r="2" fill="#95a0ab"/>
</svg>
